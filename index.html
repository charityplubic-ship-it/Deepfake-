<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepLive Avatar</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#09090f;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

header{
  padding:20px;
  background:#151522;
}

h1{margin:0;font-size:32px}

.container{
  width:95%;
  max-width:900px;
  margin:20px auto;
}

.stage{
  position:relative;
  width:100%;
  background:#000;
  border-radius:18px;
  overflow:hidden;
}

video{
  width:100%;
  display:block;
  transform:scaleX(-1);
}

canvas{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  transform:scaleX(-1);
}

.controls{
  background:#151522;
  padding:18px;
  border-radius:15px;
  margin-top:15px;
}

button{
  padding:12px 18px;
  margin:5px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

.avatar{
  background:#29293a;
  color:white;
}

.active{
  outline:3px solid white;
}

.start{
  background:white;
  color:black;
}

.stop{
  background:#444;
  color:white;
}

#status{
  color:#aaa;
  margin-top:12px;
}
</style>
</head>

<body>

<header>
  <h1>DeepLive</h1>
  <p>Live Avatar Studio</p>
</header>

<div class="container">

  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="controls">

    <h3>Choose your avatar</h3>

    <button class="avatar active" data-avatar="1">
      Avatar 1
    </button>

    <button class="avatar" data-avatar="2">
      Avatar 2
    </button>

    <button class="avatar" data-avatar="3">
      Avatar 3
    </button>

    <br>

    <button class="start" id="start">
      Start Camera
    </button>

    <button class="stop" id="stop">
      Stop Camera
    </button>

    <div id="status">
      Camera is off
    </div>

  </div>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");
const status = document.getElementById("status");

let stream = null;
let selectedAvatar = 1;
let latestPose = null;

/* -----------------------------
   AVATAR SELECTION
----------------------------- */

document.querySelectorAll(".avatar").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".avatar")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    selectedAvatar =
      Number(button.dataset.avatar);
  });

});


/* -----------------------------
   MEDIAPIPE POSE
----------------------------- */

const pose = new Pose({
  locateFile: file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});

pose.setOptions({

  modelComplexity: 1,

  smoothLandmarks: true,

  enableSegmentation: false,

  minDetectionConfidence: 0.5,

  minTrackingConfidence: 0.5

});


pose.onResults(results => {

  latestPose =
    results.poseLandmarks || null;

});


/* -----------------------------
   CAMERA
----------------------------- */

const camera = new Camera(video, {

  onFrame: async () => {

    if(video.readyState >= 2){

      await pose.send({
        image: video
      });

    }

  },

  width:1280,

  height:720

});


startButton.onclick = async () => {

  try{

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user"
        },

        audio:false

      });

    video.srcObject = stream;

    await video.play();

    camera.start();

    status.textContent =
      "Camera and body tracking are running.";

    draw();

  }catch(error){

    console.error(error);

    status.textContent =
      "Camera permission was denied.";

  }

};


stopButton.onclick = () => {

  if(stream){

    stream.getTracks().forEach(track =>
      track.stop()
    );

    stream = null;

  }

  video.srcObject = null;

  latestPose = null;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  status.textContent =
    "Camera is off.";

};


/* -----------------------------
   DRAW LOOP
----------------------------- */

function draw(){

  if(!stream) return;

  canvas.width =
    video.videoWidth || 1280;

  canvas.height =
    video.videoHeight || 720;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  if(latestPose){

    drawAvatar(
      latestPose
    );

  }

  requestAnimationFrame(draw);

}


/* -----------------------------
   AVATAR DRAWING
----------------------------- */

function point(index){

  const p =
    latestPose[index];

  return {

    x:p.x * canvas.width,

    y:p.y * canvas.height

  };

}


function drawAvatar(landmarks){

  /*
    MediaPipe landmarks:
    0 = nose
    11 = left shoulder
    12 = right shoulder
    23 = left hip
    24 = right hip
  */

  const nose = point(0);

  const leftShoulder =
    point(11);

  const rightShoulder =
    point(12);

  const leftHip =
    point(23);

  const rightHip =
    point(24);


  const shoulderWidth =
    Math.abs(
      rightShoulder.x -
      leftShoulder.x
    );


  const centerX =
    (leftShoulder.x +
     rightShoulder.x) / 2;


  /* HEAD */

  let headSize =
    Math.max(
      45,
      shoulderWidth * 0.42
    );


  /* BODY SIZE */

  let bodyWidth =
    Math.max(
      80,
      shoulderWidth * 1.15
    );


  let bodyHeight =
    Math.max(
      130,
      Math.abs(
        leftHip.y -
        leftShoulder.y
      ) * 1.2
    );


  /* AVATAR COLORS */

  let skin;
  let hair;
  let shirt;

  if(selectedAvatar === 1){

    skin = "#f0b58b";
    hair = "#24170f";
    shirt = "#7c4dff";

  }

  if(selectedAvatar === 2){

    skin = "#8d5524";
    hair = "#090909";
    shirt = "#00b894";

  }

  if(selectedAvatar === 3){

    skin = "#ffd1b3";
    hair = "#d7268b";
    shirt = "#0984e3";

  }


  /*
    BODY
  */

  ctx.save();

  ctx.translate(
    centerX,
    leftShoulder.y
  );


  ctx.fillStyle =
    shirt;

  ctx.beginPath();

  ctx.roundRect(
    -bodyWidth / 2,
    10,
    bodyWidth,
    bodyHeight,
    35
  );

  ctx.fill();


  /*
    NECK
  */

  ctx.fillStyle =
    skin;

  ctx.fillRect(
    -headSize * .18,
    -15,
    headSize * .36,
    35
  );


  /*
    HEAD
  */

  ctx.beginPath();

  ctx.ellipse(
    nose.x - centerX,
    nose.y - leftShoulder.y,
    headSize * .55,
    headSize * .68,
    0,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    skin;

  ctx.fill();


  /*
    HAIR
  */

  ctx.beginPath();

  ctx.ellipse(
    nose.x - centerX,
    nose.y - leftShoulder.y -
      headSize * .35,
    headSize * .57,
    headSize * .35,
    0,
    Math.PI,
    Math.PI * 2
  );

  ctx.fillStyle =
    hair;

  ctx.fill();


  /*
    EYES
  */

  ctx.fillStyle =
    "white";

  ctx.beginPath();

  ctx.arc(
    nose.x - centerX -
      headSize * .18,

    nose.y - leftShoulder.y -
      headSize * .05,

    7,

    0,

    Math.PI * 2
  );

  ctx.arc(
    nose.x - centerX +
      headSize * .18,

    nose.y - leftShoulder.y -
      headSize * .05,

    7,

    0,

    Math.PI * 2
  );

  ctx.fill();


  /*
    PUPILS
  */

  ctx.fillStyle =
    "#111";

  ctx.beginPath();

  ctx.arc(
    nose.x - centerX -
      headSize * .18,

    nose.y - leftShoulder.y -
      headSize * .05,

    3,

    0,

    Math.PI * 2
  );

  ctx.arc(
    nose.x - centerX +
      headSize * .18,

    nose.y - leftShoulder.y -
      headSize * .05,

    3,

    0,

    Math.PI * 2
  );

  ctx.fill();


  /*
    SMILE
  */

  ctx.strokeStyle =
    "#7b3024";

  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.arc(
    nose.x - centerX,

    nose.y - leftShoulder.y +
      headSize * .20,

    headSize * .18,

    0,

    Math.PI
  );

  ctx.stroke();


  ctx.restore();

}

</script>

</body>
</html>
