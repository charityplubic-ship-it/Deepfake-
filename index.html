<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DeepLive</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#08080d;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  padding:20px;
  background:#14141e;
  text-align:center;
}

h1{margin:0;font-size:32px}

main{
  width:95%;
  max-width:1100px;
  margin:20px auto;
}

.stage{
  position:relative;
  width:100%;
  max-width:900px;
  margin:auto;
  aspect-ratio:16/9;
  background:#000;
  border-radius:18px;
  overflow:hidden;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

.panel{
  max-width:900px;
  margin:15px auto;
  padding:18px;
  background:#14141e;
  border-radius:18px;
  text-align:center;
}

button{
  padding:13px 18px;
  margin:5px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

.avatar{
  background:#292938;
  color:#fff;
}

.avatar.active{
  outline:3px solid #fff;
}

.start{
  background:#fff;
  color:#000;
}

.stop{
  background:#444;
  color:#fff;
}

#status{
  color:#aaa;
  margin-top:12px;
}

@media(max-width:600px){
  h1{font-size:26px}

  button{
    width:90%;
    margin:6px auto;
  }
}
</style>
</head>

<body>

<header>
  <h1>DeepLive</h1>
  <p>Live Avatar Studio</p>
</header>

<main>

<div class="stage">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <canvas id="canvas"></canvas>

</div>

<div class="panel">

  <h3>Choose Your Avatar</h3>

  <button
    class="avatar active"
    data-avatar="1">
    Avatar 1
  </button>

  <button
    class="avatar"
    data-avatar="2">
    Avatar 2
  </button>

  <button
    class="avatar"
    data-avatar="3">
    Avatar 3
  </button>

  <button
    class="avatar"
    data-avatar="4">
    Avatar 4
  </button>

  <br>

  <button
    class="start"
    id="start">
    Start Camera
  </button>

  <button
    class="stop"
    id="stop">
    Stop Camera
  </button>

  <div id="status">
    Camera is off
  </div>

</div>

</main>

<script>

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const start =
  document.getElementById("start");

const stop =
  document.getElementById("stop");

const status =
  document.getElementById("status");

let stream = null;

let avatar = 1;

let animation = null;


/* AVATAR SETTINGS */

const avatars = {

  1:{
    skin:"#f0b58b",
    hair:"#24170f",
    shirt:"#7c4dff"
  },

  2:{
    skin:"#8d5524",
    hair:"#090909",
    shirt:"#00b894"
  },

  3:{
    skin:"#ffd1b3",
    hair:"#d7268b",
    shirt:"#0984e3"
  },

  4:{
    skin:"#d99a72",
    hair:"#553322",
    shirt:"#e84393"
  }

};


/* SELECT AVATAR */

document
.querySelectorAll(".avatar")
.forEach(button=>{

  button.onclick=()=>{

    document
    .querySelectorAll(".avatar")
    .forEach(b=>{
      b.classList.remove("active");
    });

    button.classList.add("active");

    avatar =
      Number(button.dataset.avatar);

  };

});


/* START CAMERA */

start.onclick=async()=>{

  try{

    stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:"user",
          width:{
            ideal:1280
          },
          height:{
            ideal:720
          }
        },

        audio:false

      });

    video.srcObject =
      stream;

    await video.play();

    status.textContent =
      "Camera is running";

    resize();

    draw();

  }

  catch(error){

    console.error(error);

    status.textContent =
      "Camera permission was denied.";

  }

};


/* STOP CAMERA */

stop.onclick=()=>{

  if(stream){

    stream
    .getTracks()
    .forEach(track=>{
      track.stop();
    });

  }

  stream=null;

  if(animation){
    cancelAnimationFrame(animation);
  }

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  status.textContent =
    "Camera is off";

};


/* CANVAS */

function resize(){

  canvas.width =
    video.videoWidth ||
    1280;

  canvas.height =
    video.videoHeight ||
    720;

}


/* DRAW */

function draw(){

  if(!stream)return;

  resize();

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawAvatar();

  animation =
    requestAnimationFrame(draw);

}


/* DRAW AVATAR */

function drawAvatar(){

  const a =
    avatars[avatar];

  const x =
    canvas.width/2;

  const y =
    canvas.height/2;

  const scale =
    Math.min(
      canvas.width,
      canvas.height
    )/600;


  /*
    BODY
  */

  ctx.fillStyle =
    a.shirt;

  ctx.beginPath();

  ctx.roundRect(

    x-130*scale,

    y-10*scale,

    260*scale,

    290*scale,

    45*scale

  );

  ctx.fill();


  /*
    NECK
  */

  ctx.fillStyle =
    a.skin;

  ctx.fillRect(

    x-22*scale,

    y-50*scale,

    44*scale,

    50*scale

  );


  /*
    HEAD
  */

  ctx.beginPath();

  ctx.ellipse(

    x,

    y-120*scale,

    78*scale,

    95*scale,

    0,

    0,

    Math.PI*2

  );

  ctx.fillStyle =
    a.skin;

  ctx.fill();


  /*
    HAIR
  */

  ctx.fillStyle =
    a.hair;

  ctx.beginPath();

  ctx.ellipse(

    x,

    y-175*scale,

    82*scale,

    52*scale,

    0,

    Math.PI,

    Math.PI*2

  );

  ctx.fill();


  /*
    EYES
  */

  ctx.fillStyle =
    "#fff";

  ctx.beginPath();

  ctx.arc(

    x-28*scale,

    y-125*scale,

    13*scale,

    0,

    Math.PI*2

  );

  ctx.arc(

    x+28*scale,

    y-125*scale,

    13*scale,

    0,

    Math.PI*2

  );

  ctx.fill();


  /*
    PUPILS
  */

  ctx.fillStyle =
    "#111";

  ctx.beginPath();

  ctx.arc(

    x-28*scale,

    y-125*scale,

    5*scale,

    0,

    Math.PI*2

  );

  ctx.arc(

    x+28*scale,

    y-125*scale,

    5*scale,

    0,

    Math.PI*2

  );

  ctx.fill();


  /*
    NOSE
  */

  ctx.strokeStyle =
    "#9c5d43";

  ctx.lineWidth =
    3*scale;

  ctx.beginPath();

  ctx.moveTo(
    x,
    y-115*scale
  );

  ctx.lineTo(
    x-5*scale,
    y-90*scale
  );

  ctx.lineTo(
    x+7*scale,
    y-90*scale
  );

  ctx.stroke();


  /*
    SMILE
  */

  ctx.strokeStyle =
    "#7b3024";

  ctx.lineWidth =
    3*scale;

  ctx.beginPath();

  ctx.arc(

    x,

    y-78*scale,

    20*scale,

    0,

    Math.PI

  );

  ctx.stroke();

}

</script>

</body>
</html>
