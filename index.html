<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepLive Face Effects</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b12;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 24px 15px;
      background: #151522;
    }

    h1 {
      margin: 0;
      font-size: 34px;
    }

    p {
      color: #aaa;
    }

    .camera-box {
      width: 94%;
      max-width: 850px;
      margin: 25px auto;
      background: #171720;
      padding: 18px;
      border-radius: 18px;
    }

    .video-container {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      background: black;
    }

    video {
      display: block;
      width: 100%;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      pointer-events: none;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 20px;
      margin: 10px 5px;
      font-size: 16px;
      cursor: pointer;
    }

    #start {
      background: white;
      color: black;
    }

    #stop {
      background: #33333f;
      color: white;
    }

    #effect {
      background: #6c5ce7;
      color: white;
    }

    .status {
      margin-top: 10px;
      color: #aaa;
    }
  </style>
</head>

<body>

<header>
  <h1>DeepLive</h1>
  <p>Real-Time Face Effects</p>
</header>

<div class="camera-box">

  <div class="video-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <button id="start">Start Camera</button>
  <button id="stop">Stop Camera</button>
  <button id="effect">Face Effect: OFF</button>

  <div class="status" id="status">
    Camera is off
  </div>

</div>

<script>
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const startButton = document.getElementById("start");
  const stopButton = document.getElementById("stop");
  const effectButton = document.getElementById("effect");
  const status = document.getElementById("status");

  let stream = null;
  let effectOn = false;

  const faceMesh = new FaceMesh({
    locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  faceMesh.onResults((results) => {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!effectOn) {
      return;
    }

    if (
      results.multiFaceLandmarks &&
      results.multiFaceLandmarks.length > 0
    ) {

      const landmarks = results.multiFaceLandmarks[0];

      /*
        Draw a simple glowing face outline.
        This demonstrates real-time face tracking.
      */

      ctx.beginPath();

      const facePoints = [
        10, 338, 297, 332, 284,
        251, 389, 356, 454, 323,
        361, 288, 397, 365, 379,
        378, 400, 377, 152, 148,
        176, 149, 150, 136, 172,
        58, 132, 93, 234, 127,
        162, 21, 54, 103, 67
      ];

      facePoints.forEach((index, i) => {

        const point = landmarks[index];

        const x = point.x * canvas.width;
        const y = point.y * canvas.height;

        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }

      });

      ctx.closePath();

      ctx.lineWidth = 6;
      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.shadowBlur = 20;
      ctx.shadowColor = "white";
      ctx.stroke();

      /*
        Add two small tracking markers near the eyes.
      */

      const leftEye = landmarks[33];
      const rightEye = landmarks[263];

      drawMarker(
        leftEye.x * canvas.width,
        leftEye.y * canvas.height
      );

      drawMarker(
        rightEye.x * canvas.width,
        rightEye.y * canvas.height
      );
    }
  });

  function drawMarker(x, y) {

    ctx.beginPath();

    ctx.arc(x, y, 8, 0, Math.PI * 2);

    ctx.fillStyle = "white";
    ctx.shadowBlur = 15;
    ctx.shadowColor = "white";

    ctx.fill();
  }

  const camera = new Camera(video, {
    onFrame: async () => {
      await faceMesh.send({ image: video });
    },
    width: 1280,
    height: 720
  });

  startButton.addEventListener("click", async () => {

    try {

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user"
        },
        audio: false
      });

      video.srcObject = stream;

      await video.play();

      camera.start();

      status.textContent = "Camera is running";

    } catch (error) {

      console.error(error);

      status.textContent =
        "Camera permission was denied or unavailable.";

    }
  });

  stopButton.addEventListener("click", () => {

    if (stream) {

      stream.getTracks().forEach(track => track.stop());

      video.srcObject = null;

      stream = null;

      status.textContent = "Camera is off";
    }
  });

  effectButton.addEventListener("click", () => {

    effectOn = !effectOn;

    if (effectOn) {

      effectButton.textContent =
        "Face Effect: ON";

      status.textContent =
        "Face tracking is active";

    } else {

      effectButton.textContent =
        "Face Effect: OFF";

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      status.textContent =
        "Camera is running";

    }
  });
</script>

</body>
</html>
