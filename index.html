<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepLive</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
      text-align: center;
    }

    header {
      padding: 25px 15px;
      background: #151522;
    }

    h1 {
      margin: 0;
      font-size: 36px;
    }

    .tagline {
      color: #aaa;
      margin-top: 8px;
    }

    .camera-box {
      width: 90%;
      max-width: 800px;
      margin: 30px auto;
      background: #171720;
      border-radius: 18px;
      padding: 20px;
    }

    video {
      width: 100%;
      max-height: 500px;
      background: black;
      border-radius: 12px;
      object-fit: cover;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      margin: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #start {
      background: #ffffff;
      color: #000;
    }

    #stop {
      background: #33333f;
      color: white;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 25px auto;
      max-width: 900px;
    }

    .feature {
      background: #171720;
      padding: 18px;
      border-radius: 12px;
      width: 180px;
    }

    footer {
      padding: 30px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>DeepLive</h1>
    <div class="tagline">
      Elevate Your Streaming Skills Today
    </div>
  </header>

  <main>

    <div class="camera-box">
      <h2>Live Camera</h2>

      <video id="camera" autoplay playsinline></video>

      <div>
        <button id="start">Start Camera</button>
        <button id="stop">Stop Camera</button>
      </div>

      <p id="status">Camera is off</p>
    </div>

    <div class="features">
      <div class="feature">🎥 Live Camera</div>
      <div class="feature">🖼️ Background Effects</div>
      <div class="feature">🎭 Avatar Tools</div>
      <div class="feature">🎙️ Voice Tools</div>
      <div class="feature">📺 Live Streaming</div>
    </div>

  </main>

  <footer>
    © 2026 DeepLive
  </footer>

  <script>
    const video = document.getElementById("camera");
    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");
    const status = document.getElementById("status");

    let stream = null;

    startButton.addEventListener("click", async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });

        video.srcObject = stream;
        status.textContent = "Camera is running";
      } catch (error) {
        status.textContent = "Camera permission was denied.";
        console.error(error);
      }
    });

    stopButton.addEventListener("click", () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
        stream = null;
      }

      status.textContent = "Camera is off";
    });
  </script>

</body>
</html>
